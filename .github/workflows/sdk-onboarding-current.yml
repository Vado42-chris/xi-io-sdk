name: SDK first-party onboarding consumer
on:
  push:
    branches: [fix/sdk-consume-first-party-onboarding-20261028]
    paths:
      - 'src/identity/onboarding-current.mjs'
      - 'scripts/validate-onboarding-current.mjs'
      - 'package.json'
      - '.github/workflows/sdk-onboarding-current.yml'
  pull_request:
    paths:
      - 'src/identity/onboarding-current.mjs'
      - 'scripts/validate-onboarding-current.mjs'
      - 'package.json'
permissions:
  contents: read
jobs:
  current-state-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/identity/onboarding-current.mjs
          npm run check:onboarding-current
