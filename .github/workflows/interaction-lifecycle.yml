name: Interaction lifecycle

on:
  pull_request:
    paths:
      - 'src/cadence/interaction-lifecycle.mjs'
      - 'scripts/validate-interaction-lifecycle.mjs'
      - 'scripts/validate-interaction-machine-next-hostile.mjs'
      - 'fixtures/cadence/interaction-lifecycle-known-answer.v1.json'
      - '.github/workflows/interaction-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/cadence/interaction-lifecycle.mjs'
      - 'scripts/validate-interaction-lifecycle.mjs'
      - 'scripts/validate-interaction-machine-next-hostile.mjs'
      - 'fixtures/cadence/interaction-lifecycle-known-answer.v1.json'
      - '.github/workflows/interaction-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate interaction lifecycle
        run: node scripts/validate-interaction-lifecycle.mjs
      - name: Validate machine-next root-stop hostile
        run: node scripts/validate-interaction-machine-next-hostile.mjs
