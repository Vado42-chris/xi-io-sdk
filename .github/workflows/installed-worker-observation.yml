name: SDK installed worker observation

on:
  pull_request:
    paths:
      - 'src/worker/installed-observation.mjs'
      - 'test/installed-worker-observation.test.mjs'
      - 'package.json'
      - '.github/workflows/installed-worker-observation.yml'
  push:
    branches: [main]
    paths:
      - 'src/worker/installed-observation.mjs'
      - 'test/installed-worker-observation.test.mjs'
      - 'package.json'
      - '.github/workflows/installed-worker-observation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check src/worker/installed-observation.mjs
      - run: node --test test/installed-worker-observation.test.mjs
