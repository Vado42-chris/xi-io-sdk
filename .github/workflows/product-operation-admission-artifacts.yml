name: Product operation admission artifacts

on:
  pull_request:
    paths:
      - 'src/billing/product-operation-admission-binding.mjs'
      - 'test/product-operation-admission-binding.test.mjs'
      - 'scripts/validate-product-operation-admission-binding.mjs'
      - 'scripts/check-product-operation-admission-artifacts.mjs'
      - 'docs/product-operation-admission-binding.md'
      - 'projects/evidence/product-operation-admission-binding-20261117.json'
      - '.github/workflows/product-operation-admission-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'src/billing/product-operation-admission-binding.mjs'
      - 'test/product-operation-admission-binding.test.mjs'
      - 'scripts/validate-product-operation-admission-binding.mjs'
      - 'scripts/check-product-operation-admission-artifacts.mjs'
      - 'docs/product-operation-admission-binding.md'
      - 'projects/evidence/product-operation-admission-binding-20261117.json'
      - '.github/workflows/product-operation-admission-artifacts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-product-operation-admission-artifacts.mjs
