name: Patch-prep economy

on:
  pull_request:
    paths:
      - 'src/patchprep/**'
      - 'scripts/validate-patchprep-economy.mjs'
      - 'package.json'
      - '.github/workflows/patchprep-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Burn 58 surface families x 12 prep cells
        run: npm run check:patchprep-economy
