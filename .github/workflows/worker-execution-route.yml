name: SDK worker execution route qualification

on:
  pull_request:
    paths:
      - 'src/worker/connection.mjs'
      - 'src/worker/execution-route.mjs'
      - 'src/identity/account-binding.mjs'
      - 'test/worker-execution-route.test.mjs'
      - '.github/workflows/worker-execution-route.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/worker/connection.mjs'
      - 'src/worker/execution-route.mjs'
      - 'src/identity/account-binding.mjs'
      - 'test/worker-execution-route.test.mjs'
      - '.github/workflows/worker-execution-route.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/worker-execution-route.test.mjs
