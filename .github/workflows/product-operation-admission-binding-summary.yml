name: Product operation admission summary

on:
  pull_request:
    paths:
      - 'src/billing/product-operation-admission-binding.mjs'
      - 'scripts/validate-product-operation-admission-binding.mjs'
      - '.github/workflows/product-operation-admission-binding-summary.yml'
  push:
    branches: [main]
    paths:
      - 'src/billing/product-operation-admission-binding.mjs'
      - 'scripts/validate-product-operation-admission-binding.mjs'
      - '.github/workflows/product-operation-admission-binding-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-product-operation-admission-binding.mjs
