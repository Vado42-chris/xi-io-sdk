name: Qualify Framework PR 1578 exact head

on:
  push:
    branches:
      - qualify/framework-pr1578-exact-head
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRAMEWORK_REPO: Vado42-chris/xi-io.net
      FRAMEWORK_HEAD: b68fcbd646defd80d296ad781de6b729fc2c72ee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact private Framework head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/framework"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$FRAMEWORK_REPO/tarball/$FRAMEWORK_HEAD" \
            -o "$RUNNER_TEMP/framework.tar.gz"
          tar -xzf "$RUNNER_TEMP/framework.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/framework"
          test "$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/$FRAMEWORK_REPO.git" "$FRAMEWORK_HEAD" | awk '{print $1}')" = "$FRAMEWORK_HEAD"
      - name: Execute exact Framework source and installed closure
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/framework"
          node --check scripts/compile-product-api-admission.mjs
          node scripts/validate-product-entitlement-source-adoption.mjs
          node scripts/validate-product-api-admission.mjs
          node scripts/validate-product-api-v6-host-admission.mjs
          node scripts/test-framework-runtime-installer-manifest.mjs
