name: Qualify Framework PR 1578 exact head

on:
  push:
    branches:
      - qualify/framework-pr1578-exact-head
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble exact accepted SDK dependency closure
        run: |
          set -euo pipefail
          root=qualification/framework-pr1578
          mkdir -p "$root/identity" "$root/sdk" "$root/worker"
          cp src/identity/account-binding.mjs "$root/identity/account-binding.mjs"
          cp src/billing/product-entitlement.mjs "$root/sdk/product-entitlement.mjs"
          cp src/billing/product-entitlement-binding.mjs "$root/sdk/product-entitlement-binding.mjs"
          cp src/billing/product-operation-admission-binding.mjs "$root/sdk/product-operation-admission-binding.mjs"
          cp src/worker/connection.mjs "$root/worker/connection.mjs"
          cp src/worker/execution-route.mjs "$root/worker/execution-route.mjs"
          printf '\n' >> "$root/compile-product-api-admission.mjs"
          test "$(git hash-object "$root/compile-product-api-admission.mjs")" = "3aefe7b31167eab9c837939090fbb5517512f10b"
      - name: Execute exact host-composition replay
        run: |
          set -euo pipefail
          node --check qualification/framework-pr1578/compile-product-api-admission.mjs
          node qualification/framework-pr1578/validate-host-composer.mjs
