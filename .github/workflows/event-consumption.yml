name: Event consumption lease

on:
  pull_request:
    paths:
      - 'src/events/consumption.mjs'
      - 'test/event-consumption.test.mjs'
      - '.github/workflows/event-consumption.yml'
  push:
    branches: [main]
    paths:
      - 'src/events/consumption.mjs'
      - 'test/event-consumption.test.mjs'
      - '.github/workflows/event-consumption.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/events/consumption.mjs
      - run: node --test test/event-consumption.test.mjs
