name: fleet-delivery-gate
on:
  pull_request:
    paths:
      - 'src/baseline/fleet-delivery.mjs'
      - 'scripts/validate-fleet-delivery-gate.mjs'
      - 'bin/xi.mjs'
      - 'package.json'
      - '.github/workflows/fleet-delivery-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/baseline/fleet-delivery.mjs'
      - 'scripts/validate-fleet-delivery-gate.mjs'
      - 'bin/xi.mjs'
      - 'package.json'
      - '.github/workflows/fleet-delivery-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate fleet delivery 100s gate
        run: |
          node --check src/baseline/fleet-delivery.mjs
          node scripts/validate-fleet-delivery-gate.mjs
          node bin/xi.mjs --help | grep 'xi fleet delivery'
